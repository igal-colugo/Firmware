# COLUGO 53 in H configuration for AMIT littleprince
# Front rotors: NO YAW authority (roll + pitch only)
# Rear rotors: NO ROLL authority (pitch + yaw only)

[info]
key = "4c"
description = "COLUGO 53 Custom: Front=no yaw, Rear=no roll"

[rotor_default]
axis_thrust = [0.0, 0.0, -1.0]
axis_torque = [0.0, 0.0, -1.0]  # CW default
ct        = 1.0
cm        = 0.05                # Default yaw torque

[[rotors]]
name      = "front_right"
position  = [0.8, 0.485, 0.0]   # Y=±0.485 provides roll authority
direction = "CW"
cm        = 0.0                 # OVERRIDE: No yaw torque

[[rotors]]
name      = "front_left"
position  = [0.8, -0.485, 0.0]  # Y=±0.485 provides roll authority
direction = "CCW"
axis_torque = [0.0, 0.0, 1.0]   # OVERRIDE: CCW torque direction
cm        = 0.0                 # OVERRIDE: No yaw torque

[[rotors]]
name      = "rear_left"
position  = [-0.8, 0.0, 0.0]    # Y=0 eliminates roll authority
direction = "CW"                # Provides yaw torque
# Uses default cm=0.05

[[rotors]]
name      = "rear_right"
position  = [-0.8, 0.0, 0.0]    # Y=0 eliminates roll authority
direction = "CCW"
axis_torque = [0.0, 0.0, 1.0]   # OVERRIDE: CCW torque direction
# Uses default cm=0.05
